<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국궁 사법 진단기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 위에 검색, 한쪽에 과녁(탄착으로 찾기)과 결과 목록, 다른 쪽에 진단 카드 */
:root{
  --bg:#f2f4f1;
  --surface:#ffffff;
  --ink:#1b2320;
  --muted:#5d6a64;
  --line:#d7ddd8;
  --accent:#b8322a;      /* 홍심 */
  --pine:#2e5a4d;        /* 솔숲 */
  --pine-soft:#e3ece7;
  --accent-soft:#f6e3e1;
  --display:"Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1a211e; --ink:#e6ebe8; --muted:#9aa8a1; --line:#2c3632;
    --accent:#e2675c; --pine:#7fb7a3; --pine-soft:#1f2d28; --accent-soft:#3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --ink:#e6ebe8; --muted:#9aa8a1; --line:#2c3632;
  --accent:#e2675c; --pine:#7fb7a3; --pine-soft:#1f2d28; --accent-soft:#3a2220;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
a{color:var(--pine)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.motto{font-family:var(--display);font-size:14px;color:var(--pine);margin:4px 0 0}
.dirkey{margin:0;font-size:14px;color:var(--ink);background:var(--pine-soft);border-radius:999px;padding:6px 14px}
.dirkey b{color:var(--pine)}
.author{margin:2px 0 6px;font-size:14px;font-weight:600;color:var(--pine)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--bg)}
.tabs{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.tabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

.search{margin:18px 0 8px;display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.search input:focus{border-color:var(--pine);outline:none}
.search button{border:0;background:var(--pine);color:var(--bg);padding:0 18px;border-radius:var(--r);cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--pine)}

.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-family:var(--display);font-size:17px;margin:0 0 8px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* 과녁 */
.target svg{width:100%;height:auto;display:block}
.zone{cursor:pointer;fill:transparent;transition:fill .15s}
.zone:hover,.zone:focus{fill:var(--accent-soft)}
.zone-label{font-size:12px;fill:var(--muted);pointer-events:none;font-family:var(--body)}
.tgt-board{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.tgt-band{fill:var(--ink)}
.tgt-hong{fill:var(--accent)}

.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.results button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.results button:hover{background:var(--pine-soft)}
.results button[aria-current="true"]{border-color:var(--pine);background:var(--pine-soft)}
.results .rt{font-weight:600;font-size:15px}
.results .rc{font-size:12px;color:var(--muted)}

/* 진단 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-head{padding:20px 22px 16px;border-left:5px solid var(--accent)}
.cat{display:inline-block;font-size:12px;color:var(--pine);background:var(--pine-soft);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.card h3{font-family:var(--display);font-size:26px;margin:0 0 6px;line-height:1.3;text-wrap:balance}
.dir{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--accent);font-weight:600;margin:2px 0 10px}
.summary{font-size:18px;margin:0;max-width:62ch}
.sec{padding:16px 22px;border-top:1px solid var(--line)}
.sec h4{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.sec p{margin:0 0 10px;max-width:68ch}
.sec p:last-child{margin-bottom:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:8px;cursor:pointer;align-items:start}
.checks input{margin-top:5px;accent-color:var(--pine);width:16px;height:16px}
.checks b{font-weight:600}
.checks span.q{display:block;color:var(--muted);font-size:14px}
ol.fix{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
ul.drill{margin:0;padding-left:20px;max-width:68ch}
.classic{display:flex;flex-direction:column;gap:10px}
.classic blockquote{margin:0;padding:8px 14px;border-left:3px solid var(--pine);background:var(--pine-soft);border-radius:0 8px 8px 0;font-family:var(--display);font-size:15.5px}
.classic blockquote.var{border-left-color:var(--accent);background:var(--accent-soft)}
.classic cite{display:block;font-family:var(--body);font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0 0}
.empty{color:var(--muted);padding:20px}
.gloss-hit{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.gloss-hit b{font-family:var(--display)}

/* 용어 사전 */
.gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.gl dt{font-family:var(--display);font-weight:700;font-size:17px}
.gl dd{margin:2px 0 0;font-size:14.5px;color:var(--ink)}
.srcs{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.srcs li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.srcs b{font-family:var(--display);font-size:16px}
.srcs span{display:block;font-size:14px;color:var(--muted)}
.all-cats{display:flex;flex-direction:column;gap:18px}
.all-cats h3{font-family:var(--display);font-size:18px;margin:0 0 6px}
.all-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.all-list button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.all-list button:hover{border-color:var(--pine)}
.all-list .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
footer{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>국궁 사법 진단기</h1>
      <p class="author">@용현정 이동철</p>
      <p class="sub">증상이나 궁금한 것을 적으면 원인, 원리, 교정법을 보여 줍니다.</p>
      <p class="motto" id="motto"></p>
    </div>
    <p class="dirkey"><b>앞</b> = 줌손 손바닥 쪽 · <b>뒤</b> = 줌손 손등 쪽</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-diag" aria-selected="true">진단</button>
    <button role="tab" id="tab-all" aria-selected="false">전체 항목</button>
    <button role="tab" id="tab-gloss" aria-selected="false">용어 사전</button>
    <button role="tab" id="tab-src" aria-selected="false">근거 자료</button>
  </div>

  <section id="view-diag">
    <form class="search" id="sform">
      <label for="q" hidden>증상 검색</label>
      <input id="q" type="search" placeholder="예: 화살이 앞날 때, 시위가 팔을 때려요, 붕어죽" autocomplete="off">
      <button type="submit">찾기</button>
    </form>
    <div class="chips" id="examples"></div>

    <div class="grid">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="panel target">
          <h2>탄착으로 찾기</h2>
          <p class="hint">살이 떨어진 곳을 누르세요.</p>
          <svg viewBox="0 0 300 300" role="group" aria-label="과녁 탄착 영역">
            <rect class="zone" id="z-top" x="70" y="4" width="160" height="48" tabindex="0" role="button" aria-label="넘어간다"></rect>
            <rect class="zone" id="z-bot" x="70" y="248" width="160" height="48" tabindex="0" role="button" aria-label="덜 간다"></rect>
            <rect class="zone" id="z-left" x="4" y="56" width="62" height="188" tabindex="0" role="button" aria-label="뒤난다: 줌손 손등 쪽"></rect>
            <rect class="zone" id="z-right" x="234" y="56" width="62" height="188" tabindex="0" role="button" aria-label="앞난다: 줌손 손바닥 쪽"></rect>
            <rect class="tgt-board" x="95" y="60" width="110" height="180"></rect>
            <rect class="tgt-band" x="95" y="60" width="110" height="34"></rect>
            <rect class="tgt-band" x="95" y="206" width="110" height="34"></rect>
            <circle class="tgt-hong" cx="150" cy="150" r="20"></circle>
            <rect class="zone" id="z-mid" x="95" y="94" width="110" height="112" tabindex="0" role="button" aria-label="앞뒤로 흩어진다" style="fill-opacity:.0"></rect>
            <text class="zone-label" x="150" y="32" text-anchor="middle">넘어간다 · 크다</text>
            <text class="zone-label" x="150" y="276" text-anchor="middle">덜 간다 · 짧다</text>
            <text class="zone-label" x="35" y="148" text-anchor="middle">뒤난다</text><text class="zone-label" x="35" y="164" text-anchor="middle">(손등 쪽)</text>
            <text class="zone-label" x="265" y="148" text-anchor="middle">앞난다</text><text class="zone-label" x="265" y="164" text-anchor="middle">(손바닥 쪽)</text>
            <text class="zone-label" x="150" y="122" text-anchor="middle" style="fill:var(--muted)">흩어짐</text>
          </svg>
          <p class="hint" style="margin:8px 0 0">그림의 좌우와 상관없이 줌손 기준으로 누르세요. 손바닥 쪽으로 빠지면 앞난다, 손등 쪽이면 뒤난다.</p>
        </div>
        <div class="panel">
          <h2 id="res-title">관련 항목</h2>
          <ul class="results" id="results"></ul>
        </div>
      </div>
      <div id="detail"></div>
    </div>
  </section>

  <section id="view-all" hidden>
    <div class="all-cats" id="all"></div>
  </section>

  <section id="view-gloss" hidden>
    <form class="search" onsubmit="return false">
      <label for="gq" hidden>용어 검색</label>
      <input id="gq" type="search" placeholder="용어 찾기 (예: 중구미, 봉뒤)">
    </form>
    <dl class="gl-grid" id="gloss"></dl>
  </section>

  <section id="view-src" hidden>
    <ul class="srcs" id="srcs"></ul>
  </section>

  <footer>
    <span><span id="meta"></span> · @용현정 이동철</span>
    <span><button id="copy-json">지식베이스 JSON 복사</button> <span id="copy-msg" aria-live="polite"></span></span>
  </footer>
</div>

<script id="kb" type="application/json">{"meta": {"title": "국궁 사법 진단 지식베이스", "version": "2.3 (2026-11-18)", "basis": "조선의 궁술(1929), 사예결해(1777), 사법비전공하(1799), 정사론(1872), 무신수지, 1934년 조선일보 「조선의 궁도와 사풍」, 황학정 궁도입문서, 국궁신문 기사(사벽과 교정·비정비팔·깍지손 쥐기 등), 활터 교범·교안을 현대어로 재정리. 자료끼리 다른 설명은 '자료마다 다른 설명'에 나란히 실음. 방향은 줌손 기준: 손바닥 쪽이 앞, 손등 쪽이 뒤.", "sources": [{"key": "조선의 궁술", "desc": "이중화, 조선궁술연구회 1929. 궁체의 종류·신사입문지계."}, {"key": "사예결해", "desc": "정조 1년(1777). 명궁 이춘기 구술, 서영보 채록(『죽석관유집』). 요결 15조·해설 5조. 조영석 역, 국궁신문 2021."}, {"key": "사법비전공하", "desc": "정조 22년(1799) 평양감영 간행. 청 주용 『무경칠서휘해』(1700) 말권 복간. 심담십사요·원실. 정진명 『한국의 활쏘기』 역문, 국궁신문 2000·2001."}, {"key": "사결", "desc": "서유구 『임원경제지』 「유예지」. 사법비전공하를 많이 인용."}, {"key": "정사론", "desc": "고종 9년(1872) 장언식. 피아(彼我) 개념. 김세현 국역, 육군박물관 학예지 15집(2008)."}, {"key": "무신수지", "desc": "이정집·이적, 1798 완성·1809 간행. 성백효 역, 국방부전사편찬위원회 1986. 국궁신문 2019."}, {"key": "조선일보 1934", "desc": "「조선의 궁도와 사풍(7)」 1934.6.13. 궁사 직립자세 12개 요건. 국궁신문 2000."}, {"key": "황학정 궁도입문서", "desc": "충무정지(1998) 부록. 주살내기·발디딤. 국궁신문 2000."}, {"key": "사벽과 교정", "desc": "국궁신문 「활병을 고쳐 명궁이 되자」. 구사 경험과 조선의 궁술 교범 바탕의 증상별 교정."}, {"key": "비정비팔은 영원한 고전", "desc": "국궁신문 2000. 황학정·충북궁도협회 교범, 이목정·충무정 등 활터 견해 모음."}, {"key": "조영석 「깍지손 쥐기」", "desc": "국궁신문 2002. 깍지 끼우기·걸기·쥐기."}, {"key": "사법 8절 교본", "desc": "활터에서 널리 쓰는 실기 교본(발디딤~잔신 8단계, 신체 11부위)."}, {"key": "활터 교안·용어집", "desc": "각 정 국궁공부방의 교안과 용어집."}, {"key": "전통 사법 해설", "desc": "조선의 궁술을 구사 대담과 함께 풀어 쓴 활터 해설 자료."}, {"key": "역학 해설", "desc": "이 자료에서 새로 붙인 현대 역학 설명과 어림 계산."}, {"key": "황학정 궁도교실 교범(웹)", "desc": "황학정 국궁지식 「활쏘기」. 살 먹이기, 깃이 줌손을 훑는 원인, 볼·팔 맞는 원인과 교정."}, {"key": "포항 송학정 「오늬 먹이기」", "desc": "오늬 자리 정하기·점검법, 오늬 높이와 깃·살대 접촉, 절피 두께."}, {"key": "국문연 「오늬 높이와 살걸음」", "desc": "오늬 높이 기준과 상하 비행."}, {"key": "대한궁술협회 「활쏘는 기본자세」", "desc": "겨냥 눈, 원근·앞뒤로 겨냥점 잡기, 겨냥점 옮기기."}, {"key": "조선 철전사법 연구회 「궁수의 파라독스(올바른 겨냥과 표 보기)」", "desc": "과녁 중심선 겨냥, 오조준과 출전피, 정사론 제16편 인용."}, {"key": "단오 블로그 「활, 그 표를 잡는 방법」", "desc": "약한 활의 엄지뿌리·살대 삼각형 표."}], "motto": "정곡을 맞히지 못하면 원인을 자신에게서 찾는다 — 반구저기신(反求諸其身)"}, "items": [{"id": "ap", "title": "화살이 앞난다", "cat": "탄착 · 앞뒤", "dir": "과녁의 줌손 손바닥 쪽(앞)", "keywords": ["앞난다", "앞나", "앞날", "앞나요", "앞나는", "줌앞", "앞나서", "앞납니다", "줌 앞으로 빠", "줌앞으로", "손바닥 쪽", "손바닥쪽"], "summary": "발시 순간 활(줌)이 앞으로 밀리거나, 깍지손이 줌손보다 이겨서 시위를 몸 쪽으로 끌고 가면 살은 앞으로 난다.", "principle": ["화살 방향은 발시 순간 두 점이 정한다. 앞점은 줌통(화살이 얹힌 곳), 뒷점은 오늬(시위가 밀어내는 곳)다. 앞점이 줌손 손바닥 쪽(앞)으로 움직이거나 뒷점이 목·뒤통수 쪽으로 끌리면 화살 머리가 앞을 향한다.", "줌통과 오늬 사이 거리는 화살 길이(약 80~90cm)뿐이다. 145m 거리에서 과녁 폭 2m를 벗어나려면 각도로 약 0.4°면 충분한데, 오늬를 고정하고 보면 이는 줌손이 옆으로 6mm 정도만 움직인 것과 같다. 그래서 앞나고 뒤나는 것은 거의 '줌손과 깍지손의 힘싸움'에서 갈린다.", "옛 말로 정리하면 '앞나는 살은 깍지손이 우악스러웠다는 뜻'이다. 발시 순간 깍지손이 목·뒤통수 쪽으로 감기거나 과하게 쥐어짜면 시위가 몸 쪽으로 끌리며 출발한다."], "causes": [{"name": "깍지손이 줌손보다 셈(우악스러운 뒤)", "check": "발시 순간 깍지손이 목·뒤통수 쪽으로 감겨 들어오는가? 최근 깍지손에 힘을 더 주기 시작했는가?"}, {"name": "줌손이 약해져 앞으로 밀림", "check": "발시 직후 줌손이 손바닥 쪽(앞)으로 휙 돌아가는가? 줌을 바깥으로 트는 힘(흘려쥐기 비틀림)이 약해지지 않았는가?"}, {"name": "화살이 줌통을 스치며 출발", "check": "흘려쥐기가 풀려 활이 손 안에서 바로 서면 화살이 활 몸체에 닿기 쉽다. 줌통 옆이나 출전피에 긁힌 자국이 있는가?"}, {"name": "몸통이 앞으로 열림 / 뒷발이 너무 빠짐", "check": "뒷발을 과녁 반대쪽으로 많이 빼면 상체가 앞쪽(줌손 손바닥 쪽)으로 돌아가 살도 앞난다. 발 모양이 평소와 같은가?"}, {"name": "겨냥점(표)이 앞으로 옮겨짐", "check": "만작에서 줌통이 과녁의 어느 지점에 걸리는가? 매번 같은 곳인가?"}, {"name": "뒷바람", "check": "줌손 손등 쪽에서 손바닥 쪽으로 부는 바람(줌뒷바람)이면 살이 앞난다. 과녁 옆 깃발이나 풀잎을 확인했는가?"}, {"name": "줌을 안쪽으로 너무 들잡음", "check": "줌통을 활 중앙선보다 안쪽으로 깊이 넘겨 잡지 않았는가?"}, {"name": "활을 너무 눕힘(음지)", "check": "평소보다 활이 많이 기울어 있지 않은가?"}, {"name": "시위가 너무 높음", "check": "시위를 얹은 높이(줌통과 시위 사이)가 평소보다 높지 않은가?"}, {"name": "평소보다 굵은 살", "check": "늘 쓰던 살보다 굵거나 무거운 살을 쓰지 않았는가?"}, {"name": "절피가 헐거움(오늬가 느슨하게 낌)", "check": "오늬가 절피에 헐겁게 끼지 않는가? 헐거우면 앞으로 흐른다."}], "fixes": ["깍지손을 손목으로 비틀어 감지 않는다. 짜는 힘은 빨래 짜듯 양손이 서로 반대로 비트는 데서 나오게 하고, 손등·손목·팔등은 일직선으로 둔다.", "줌손은 흘려쥔 상태에서 활을 바깥으로 살짝 트는 힘을 유지한다. 반바닥(엄지 뿌리)으로 밀고, 줌을 안쪽으로 너무 들잡지 않는다.", "죽머리와 중구미로 조여(쪼아) 쏜다. 줌손이 활에 빼앗기면(밀리면) 활을 무르게 한다.", "활을 조금 세워(양지) 쏴 본다.", "비정비팔을 다시 확인한다. 발을 고치면 살 방향도 따라 바뀐다.", "시위 높이와 살 굵기를 평소 쓰던 대로 맞춘다. 바람이 원인이면 '바람' 항목을 따른다."], "drills": ["주살질 10회: 발시 순간 깍지손이 목 쪽으로 감기지 않는지 거울이나 영상으로 확인.", "빈활 밀기: 만작에서 3초 버티며 줌손 반바닥으로 과녁 머리를 지그시 미는 감각만 익힌다.", "고침쏘기(근거리 표적): 앞나는 살이 줄어드는지 5발 단위로 기록."], "classic": [{"src": "전통 사법 해설", "text": "뒤로 나는 살은 깍지손이 줌손에 졌다는 뜻이고, 앞나는 살은 깍지손이 지나치게 셌다는 뜻이다."}, {"src": "활터 교안·용어집", "text": "앞난다는 '줌손 앞쪽으로 떨어진다'는 뜻이다. 줌손 손바닥이 향한 쪽이 앞, 손등 쪽이 뒤다."}, {"src": "국궁신문 「사벽과 교정」", "text": "화살이 줌 앞으로 빠질 때: 줌손을 너무 들잡지 말 것, 줌손을 빼앗기지 말 것, 죽머리와 중구미로 조여 쏠 것, 활을 양지(세움)로 잡을 것, 시위를 너무 높이지 말 것, 평소보다 굵은 살을 쓰지 말 것."}, {"src": "포항 송학정 「오늬 먹이기」", "text": "절피가 얇거나 헐거우면 낙전하기 쉽고, 헐거운 상태로 쏘면 과녁 중심에서 앞쪽으로 흐른다."}], "related": ["dwi", "scatter", "heullyeo", "wind", "stance", "tilt", "bowstate"], "variants": [{"src": "이목정 최진규 · 관악정", "text": "뒷발이 과녁 반대쪽으로 너무 빠지면 앞나고, 과녁 쪽으로 너무 나오면 뒤난다. 앞나면 뒷발을 조금 과녁 쪽으로."}, {"src": "습사 일기(김병곤)", "text": "앞나면 뒷발을 약간 과녁 반대쪽으로 빼고, 뒤나면 약간 과녁 쪽으로 당긴다. 위 설명과 방향이 반대이므로 자기 궁체에서 확인해 본다."}]}, {"id": "dwi", "title": "화살이 뒤난다", "cat": "탄착 · 앞뒤", "dir": "과녁의 줌손 손등 쪽(뒤)", "keywords": ["뒤난다", "뒤나", "뒤날", "뒤나요", "뒤나는", "줌뒤", "뒤나서", "뒤납니다", "줌 뒤로 빠", "줌뒤로", "손등 쪽", "손등쪽"], "summary": "줌이 서지 않아 발시 순간 줌손이 뒤로 젖혀지거나, 깍지손이 줌손에 져서 시위를 바깥으로 놓아 버리면 살은 뒤난다.", "principle": ["앞나는 경우의 거울상이다. 앞점(줌통)이 줌손 손등 쪽(뒤)으로 밀리거나, 뒷점(오늬)이 얼굴에서 바깥쪽으로 튕겨 나가면 화살 머리가 뒤를 향한다.", "줌이 '선다'는 것은 중구미를 엎어 팔뼈와 근육이 활의 반동을 받아내는 상태다. 줌이 서지 않으면 발시 반동에 줌손이 바깥으로 젖혀지고, 살은 거의 뒤난다.", "깍지손을 낮게 끌어 살대가 뺨에서 떨어져 있으면, 발시 때 깍지손이 바깥으로 뿌려지며 시위가 얼굴 바깥쪽으로 출발한다. 양궁에서 '플러킹'이라 부르는 현상과 같은 원리다."], "causes": [{"name": "줌이 서지 않음(붕어죽·앉은죽)", "check": "만작에서 중구미가 하늘을 보거나 어중간한가? 발시 후 줌손이 손등 쪽(뒤)으로 젖혀지는가?"}, {"name": "깍지손이 줌손에 짐(봉뒤)", "check": "깍지손을 그 자리에서 놓아 버리는가? 활이 내 힘보다 세지 않은가?"}, {"name": "깍지손을 낮게 끌어 살대가 뺨에서 뜸", "check": "만작 때 살대가 입꼬리 아래에 있거나 뺨에 붙지 않는가?"}, {"name": "줌손을 미리 밀어 버림", "check": "깍지손이 귀를 지나기 전에 줌손부터 내밀지 않는가? 과녁을 마주 보고 서는 궁체일수록 이 영향이 크다."}, {"name": "앞바람", "check": "줌손 손바닥 쪽에서 손등 쪽으로 부는 바람(줌앞바람)이면 살이 뒤난다."}, {"name": "깍지손이 몸에서 떨어짐", "check": "당길 때 깍지손과 시위가 얼굴·몸에서 떨어져 있지 않은가?"}, {"name": "턱이 들리거나 몸이 뒤로 누움", "check": "만작 때 턱끝이 들리고 상체가 뒤로 젖혀지지 않는가?"}, {"name": "가슴에 힘이 들어감", "check": "가슴을 내밀거나 뒤로 기울 : ["만작에서 '한 번 더' 밀고 당기는 마음으로 가슴을 빠개듯 양쪽으로 펼친다. 힘이 절정에 이르렀을 때 살이 저절로 나가게 한다.", "깍지손이 시위를 따라 나가지 않는 버릇을 주살질로 들인다.", "줌손은 과녁 머리를 향한 채 발시 뒤에 떨어지게 한다.", "피로가 원인이면 쉬는 것이 교정이다. 지친 상태로 쏘면 잘못된 버릇이 굳는다.", "줌은 처음에 가볍게 쥐었다가 당기면서 하삼지를 점점 조인다.", "절피에 오늬 자리를 표시해 매번 같은 곳에 먹인다.", "활은 내가 이길 수 있게 무르게 하고, 줌통 가운데를 민다."], "drills": ["빈활 만작에서 3초 동안 촉 위치가 줌통에서 1mm도 나오지 않도록 버티기.", "주살질: 발시 순간 깍지손이 얼굴 앞쪽으로 따라 나오지 않는지 확인."], "classic": [{"src": "활터 교안·용어집", "text": "깍지손이 시위를 따라 딸려 나가면 살이 과녁에 미치지 못하므로, 처음부터 깍지손이 시위를 따라가지 않는 버릇을 들여야 한다."}, {"src": "전통 사법 해설", "text": "만작에서 힘을 멈추면 게우게 된다. 가슴을 빠개듯 밀고 당기면 힘이 응축된 절정에서 살이 튕겨 나간다."}, {"src": "사법비전공하(1799)", "text": "활을 직각으로 잡으면 범아귀에 힘이 들어가고 하삼지가 풀려서 살이 덜 간다(지궁여악란)."}, {"src": "사예결해(1777)", "text": "장지·무명지·소지 세 손가락을 길게 늘여 단단히 잡으면 살의 힘이 좋아 멀리 간다."}], "related": ["toechok", "ttallyeo", "over", "yeongchuk", "wind", "heullyeo", "bowstate"], "variants": []}, {"id": "yeongchuk", "title": "거리가 들쭉날쭉하다 (영축)", "cat": "탄착 · 상하", "keywords": ["영축", "거리가", "들쭉날쭉", "더가고 덜가고", "크고 작고", "높낮이", "상하 산포", "위아래", "오늬 위치", "오늬 자리", "오늬를 높", "오늬를 낮", "탑전"], "summary": "더 가고 덜 가는 차이(영축)는 거의 '만작 길이'와 '깍지손 높이'가 매번 다른 데서 온다.", "principle": ["앞뒤(앞나고 뒤나는 것)는 줌손·깍지손 힘싸움이, 위아래는 당긴 길이와 발사 각도가 정한다.", "만작 길이 1cm 차이가 과녁에서 1m 안팎 높이 차로 커질 수 있다(어림 계산). 그래서 명궁일수록 '어디까지 당기는가'를 몸의 기준점으로 고정한다."], "causes": [{"name": "만작 길이가 매번 다름", "check": "촉이 줌통에 오는 위치가 발마다 같은가?"}, {"name": "살대가 걸리는 높이가 다름", "check": "광대뼈·입꼬리 기준을 지키는가?"}, {"name": "만작 시간이 다름", "check": "오래 버틴 살이 짧은가?"}, {"name": "살의 무게·길이가 제각각", "check": "한 순의 살 무게가 고른가?"}, {"name": "오늬 먹이는 자리가 매번 다름", "check": "절피에 오늬 자리를 표시했는가?"}, {"name": "양손 높이 균형이 깨짐", "check": "앞손이 낮고 뒷손이 높지 않은가?"}, {"name": "깍지를 오늬에 붙여 걺", "check": "깍지가 오늬를 밀어 올리지 않는가?"}, {"name": "줌통을 미는 높이가 매번 다름", "check": "반바닥이 줌통 가운데를 미는가?"}], "fixes": ["깍지손 멈춤 위치를 몸에서 정한다(귀 뒤, 어깨 끝 부근 등). 촉 위치도 함께 본다.", "살대 위치를 광대뼈와 입꼬리 사이로 고정.", "만작 리듬을 숨 한 번 길이로 통일.", "살은 같은 무게(같은 '돈')끼리 한 순으로 묶는다.", "절피에 오늬 자리를 표시한다.", "양손이 평형을 이루게 한다.", "깍지는 오늬에서 오늬 너비만큼 아래에 건다."], "drills": ["빈활 만작 위치 맞추기 20회.", "순마다 '크다/작다'만 따로 기록."], "classic": [{"src": "활터 교안·용어집", "text": "살이 더 가고 덜 가는 것을 영축이라 한다. 영축이 많을수록 거리가 일정하지 않다는 뜻이다."}, {"src": "사법비전공하(1799)", "text": "앞손이 낮고 뒷손이 높으면 살이 고르게 날아가지 않는다. 양손은 조금도 한쪽이 높거나 낮지 않게 평형을 이룬다(수요평형)."}, {"src": "사예결해(1777)", "text": "줌통은 높게 윗부분을 밀거나 낮게 밑부분을 밀지 말고 똑바로 민다. 적중의 묘리는 호구에 있다."}], "related": ["over", "short", "toechok", "anchor", "arrow"], "variants": []}, {"id": "wind", "title": "바람 탈 때 (바람 이름과 보정)", "cat": "탄착 · 환경", "keywords": ["바람", "앞바람", "뒷바람", "오늬바람", "촉바람", "안바람", "줌앞바람", "줌뒷바람", "바람 보정", "설쏜다", "꽉쏜다", "바람 잡"], "summary": "약한 바람은 활 기울기와 줌손·깍지손 조이기로 맞서고, 센 바람은 초시를 그대로 쏴 보고 빗나간 만큼 표를 옮긴다.", "principle": ["바람 이름(사대에서 과녁을 볼 때, 줌손 기준): 줌뒷바람(뒷바람)은 줌손 손등 쪽에서 손바닥 쪽으로 불어 살이 앞난다. 줌앞바람(앞바람)은 손바닥 쪽에서 손등 쪽으로 불어 살이 뒤난다. 오늬바람은 사대에서 과녁 쪽으로 불어 더 가고, 촉바람(안바람)은 과녁에서 사대 쪽으로 불어 덜 간다.", "활을 세우면(양지) 살이 앞나는 쪽이 줄고, 눕히면(음지) 뒤나는 쪽이 준다. 약한 바람은 이 성질로 맞설 수 있다.", "화살이 빠르고 떨림 없이 곧게 나갈수록(꽉 쏜 살) 바람을 덜 탄다. 힘없이 나간 살(설쏜 살)은 바람을 많이 탄다."], "causes": [{"name": "바람 방향을 확인하지 않음", "check": "과녁 옆 깃발, 나뭇잎, 사대와 과녁 사이 풀의 흔들림을 보았는가?"}, {"name": "바람에 맞서 궁체를 바꿈", "check": "바람 때문에 줌손을 비틀거나 깍지손을 다르게 내고 있지 않은가?"}], "fixes": ["줌뒷바람이 약할 때: 활을 양지로 잡고 줌손을 많이 조이고 짜서 쏜다. 깍지손은 조이기와 짜기를 약하게 하거나 하지 않는다.", "줌뒷바람이 셀 때: 하삼지와 반바닥을 더 강하게 밀고, 초시는 바람을 잡지 않고 쏴서 떨어진 거리만큼 표를 과녁 뒤쪽(줌손 손등 쪽)으로 옮긴다.", "줌앞바람이 약할 때: 활을 음지로 잡고 줌손 조이기는 약하게 하며 줌손목을 힘주어 민다. 깍지손은 몸에 바짝 붙여 당기며 많이 조이고 짜서 쏜다.", "줌앞바람이 셀 때: 초시를 보고 떨어진 거리만큼 표를 과녁 앞쪽(줌손 손바닥 쪽)으로 옮긴다.", "오늬바람·촉바람은 표를 위아래로 옮긴다. 바람이 잦아드는 때를 기다리는 것도 기술이다."], "drills": ["바람 일지: 날짜·바람 방향·표 이동량·결과를 기록해 자기만의 보정표를 만든다."], "classic": [{"src": "국궁신문 「사벽과 교정」", "text": "줌 뒷바람이 약하면 활을 양지로 잡고 줌손을 조이고 짜서 쏘고, 강하면 초시를 쏘아 떨어진 곳을 보고 그 거리만큼 표를 옮긴다. 줌 앞바람이 약하면 활을 음지로 잡고 깍지손을 몸에 붙여 조이고 짜서 쏜다."}, {"src": "활터 교안·용어집", "text": "잘 쏘는 것을 꽉쏜다고 하며, 꽉 쏘면 바람을 거의 타지 않는다."}], "related": ["ap", "dwi", "over", "short", "aim", "tilt"], "variants": []}, {"id": "bungeo", "title": "중구미가 엎어지지 않는다 (붕어죽·앉은죽)", "cat": "줌손", "keywords": ["붕어죽", "앉은죽", "중구미", "팔꿈치", "엎기", "엎어", "줌이 안 선다", "줌 세우기", "줌이 서지", "팔꿈치 안쪽", "엎은죽"], "summary": "중구미(팔꿈치)가 하늘을 보면 붕어죽, 어중간하면 앉은죽이다. 엎어야 줌이 서고, 줌이 서야 살이 모인다.", "principle": ["중구미를 엎으면 팔꿈치 둘레의 근육과 힘줄이 관절을 감싸 줌팔이 하나의 기둥이 된다. 발시 충격이 관절로 들어가지 않고, 줌손이 휘청거리지 않으며, 줌손의 등힘을 쓸 수 있다.", "붕어죽이 나쁜 이유는 맞히기 문제만이 아니다. 중구미가 엎이지 않으면 등에서 줌손까지 힘이 이어지지 않고, 시위가 팔을 때리기도 쉽다.", "제대로 엎으면 팔꿈치 뒤 움푹한 곳이 살짝 보이고, 활장이 함께 기울어 아랫장이 팔뚝에 가깝게 붙는다.", "위팔(앞팔 상반절)을 틀어야 줌팔이 곧게 펴진다. 위팔을 돌리지 않으면 줌팔이 굽고 힘이 빠져 마디마디가 어그러진다(사법비전공하 전방요전). 사예결해도 줌팔은 품듯이 안으로 향하게 하고, 만작 뒤 안쪽으로 비틀어 세우라고 한다."], "causes": [{"name": "활이 셈", "check": "만작에서 버티기 벅찬가? 활을 이기지 못하면 엎을 수 없다."}, {"name": "하삼지가 풀림", "check": "중지·약지·새끼손가락이 줌통에서 떨어지지 않는가?"}, {"name": "막줌으로 쥠", "check": "손가락이 활과 직각으로 만나는가?"}, {"name": "체형(멍에팔)", "check": "팔이 끝까지 펴지지 않는 체형이라면 다른 처방이 필요하다."}], "fixes": ["흘려쥔 상태에서 팔 전체를 바깥으로 살짝 돌려 팔꿈치 안쪽이 옆(살짝 아래)을 보게 한다.", "활이 세다면 한 단계 무른 활로 바꿔 '활을 이기는' 감각부터 익힌다.", "중구미가 끝내 덜 엎인다면 활을 무르게, 줌통을 평평하게, 뒤를 가볍고 날렵하게 내는 것으로 보완한다.", "체형상 멍에팔이면 깍지손을 더 바짝 끌어 연삽하게(부드럽고 매끄럽게) 낸다."], "drills": ["활 없이 줌팔 뻗고 중구미 엎기 10초 × 10회.", "빈활 만작 5초 유지하며 거울로 팔꿈치 방향 확인."], "classic": [{"src": "조선의 궁술(1929)", "text": "줌팔 중구미가 엎이지 않고 하늘을 보는 모양을 붕어죽, 이도 저도 아닌 모양을 앉은죽이라 하여 경계했다."}, {"src": "전통 사법 해설", "text": "단단한 줌손의 조건은 앞이 둥글 것, 죽머리를 바짝 붙일 것, 중구미를 엎을 것, 그리고 흘려쥐기다."}, {"src": "사법비전공하(1799)", "text": "앞팔 상반절을 틀어서 곧게 펴야 한다. 돌리는 것이 곧게 펴는 것이다(전방요전)."}], "related": ["dwi", "scatter", "armslap", "heullyeo", "bowweight"], "variants": []}, {"id": "heullyeo", "title": "줌을 어떻게 쥐나 (흘려쥐기 vs 막줌)", "cat": "줌손", "keywords": ["흘려쥐기", "흘려쥐", "흘려잡기", "막줌", "줌 쥐는", "줌손 쥐는", "줌통", "하삼지", "범아귀", "북전", "반바닥", "줌손 잡는", "활 잡는 법", "그립", "달걀", "계란", "거드쳐", "들잡"], "summary": "손가락이 활과 비스듬히 만나게 쥔다. 처음엔 달걀 쥐듯 가볍게 쥐었다가 당기면서 하삼지를 점점 조이고, 반바닥(엄지 뿌리)으로 줌통 가운데를 곧게 민다.", "principle": ["흘려쥐면 활이 손 안에서 바깥으로 살짝 틀어진 상태로 버틴다. 이 비틀림 덕분에 화살이 줌통을 치지 않고 곧게 나간다(화살이 통을 '치고 나간다'고 표현한다).", "막줌(막대기 쥐듯 직각으로 쥠)은 줌통을 손바닥 전체로 움켜쥐게 되어 발시 때 손이 활을 돌려 버린다. 앞나고 뒤나는 것이 흔들리는 대표 원인이다.", "흘려쥐면 범아귀(엄지와 검지 사이)가 좁아지고 검지 둘째 마디(북전)가 높이 솟는다. 이 모양이 맞게 쥐었는지 확인하는 표지다.", "활을 직각으로 쥐면 범아귀에 힘이 들어가고 하삼지가 풀려 살이 덜 간다. 손바닥 아랫부분을 너무 위로 밀어 쥐면 손과 팔에 힘이 실리지 않아 살이 힘없이 나간다(사법비전공하 지궁여악란).", "달걀 쥐듯 쥐면 손과 줌통이 꼭 맞는 옷처럼 밀착되고, 활이 반달처럼 약간 기운다. 그러면 활이 너무 눕거나 서는 병도 저절로 없어진다."], "causes": [{"name": "막대기 쥐듯 쥠", "check": "손가락 마디가 활과 직각을 이루는가?"}, {"name": "너무 꽉 쥠", "check": "손가락 끝이 하얗게 될 정도로 쥐는가?"}, {"name": "엄지 뿌리가 아닌 손바닥 아래쪽으로 밂", "check": "줌통 중심이 반바닥(엄지 뿌리)에 닿는가?"}, {"name": "쏘는 도중 고쳐 쥠", "check": "거궁·만작 중 손을 다시 쥐는가?"}], "fixes": ["살먹이기 전에 활을 바깥으로 미리 살짝 틀어 쥐어 두면 당길 때 활이 손 안으로 자연스럽게 들어온다.", "하삼지로 계란을 쥐듯 가볍게, 검지 첫째·둘째 마디는 높이고 엄지는 낮춘다.", "범아귀를 다물어 엄지와 검지 사이에 틈이 없게 한다.", "한 번 쥔 줌은 발시까지 고쳐 쥐지 않는다.", "줌을 활 중앙선 안쪽으로 너무 들잡지 않는다.", "남은 엄지와 검지도 하삼지를 따라 쥐는 모양을 한다(검지는 북전을 솟게, 엄지는 중지 위에). 손가락을 펴면 힘의 균형이 무너진다."], "drills": ["활 들고 쥐기 연습: 쥐고→북전 높이 확인→범아귀 틈 확인 20회.", "빈활로 거궁부터 만작까지 줌을 고쳐 쥐지 않고 한 번에 밀어 내기."], "classic": [{"src": "조선의 궁술(1929)", "text": "줌손은 범아귀를 다물고 흘려쥐며, 검지 마디는 높이고 엄지는 낮춘다."}, {"src": "조선일보 1934 「조선의 궁도와 사풍」", "text": "줌손은 하삼지를 흘려서 거두어(거드쳐) 쥘 것."}, {"src": "사예결해(1777)", "text": "줌을 쥘 때 계교를 부리지 말고, 느슨하게 쥐었다가 점차 조여 간다(자송이긴). 엄지의 볼록한 부분으로 줌통을 밀면 살이 흐트러져 날리지 않는다."}, {"src": "사법비전공하(1799)", "text": "활을 쥐는 것은 달걀을 잡듯이 한다(지궁여악란)."}], "related": ["ap", "bungeo", "heukbatgi", "jumshake", "armslap", "fletchslap"], "variants": [{"src": "사법비전공하(1799)", "text": "달걀 쥐듯 가볍지도 무겁지도 않게 쥔다."}, {"src": "사예결해(1777)", "text": "하삼지를 길게 늘여 단단히(緊握) 잡아야 살이 멀리 간다. 단, 처음엔 느슨하게 쥐었다 점차 조인다."}]}, {"id": "heukbatgi", "title": "줌손 손목이 꺾인다 (흙받기줌)", "cat": "줌손", "keywords": ["흙받기", "흙받기줌", "손목 꺾", "회목", "줌손 손목", "손목이 젖혀", "줌손이 꺾"], "summary": "줌손 회목(손목)이 뒤로 젖혀져 꺾이면 등힘이 끊기고 시위에 팔을 맞기 쉽다. 손등과 팔등이 일직선이어야 한다.", "principle": ["등힘은 손등에서 어깨까지 팔 바깥쪽이 일직선으로 뻗어 밀 때 생긴다. 손목이 꺾이면 이 직선이 끊겨 힘이 손목에서 새고, 발시 반동에 손목이 흔들린다.", "흙받기는 미장이가 흙을 얹는 판으로, 손바닥이 위로 젖혀진 모양을 빗댄 말이다.", "손바닥 아랫부분을 너무 위로 밀어 쥐면 손과 팔에 힘이 실리지 않아 살이 힘차게 나가지 않는다(사법비전공하)."], "causes": [{"name": "손바닥 아래쪽으로 밂", "check": "줌통을 손바닥 아랫부분으로 받치고 있는가?"}, {"name": "활이 셈", "check": "손목으로 버텨야 할 만큼 활이 무거운가?"}], "fixes": ["줌통 중심을 엄지 뿌리(반바닥)에 두고, 손등-손목-팔등이 일직선이 되게 민다.", "손목은 세우되 힘을 빼고 ls": ["빈활 만작 3초 유지하며 촉 위치 확인 × 10회.", "만작에서 숨을 아랫배로 내리는 연습."], "classic": [{"src": "전통 사법 해설", "text": "만작에서 힘을 멈추면 게우게 된다. 힘은 중구미와 죽머리에 걸고, 가슴을 빠개듯 밀고 당기며 허벅지와 분문을 조인다."}, {"src": "활터 교안·용어집", "text": "퇴촉은 만작 상태에서 힘이 풀리거나 균형이 무너져 촉이 밀려 나오는 것으로, 밀고 당기기를 멈추면 필연적으로 생긴다."}, {"src": "무신수지(1809)", "text": "앞손은 범을 막듯이 하고, 뒷손은 나뭇가지에 붙듯이 한다(전수여거호 후수여부지)."}, {"src": "사예결해(1777)", "text": "심(審)은 만작 전에 살피는 것이 아니라 다 당긴 뒤에 살피는 것이다. 앞으로 밀고 뒤로 당기면 몸이 활 속으로 들어가 과녁을 향한다."}], "related": ["short", "ttallyeo", "yeongchuk", "tremble", "breath"], "variants": []}, {"id": "wolchok", "title": "화살 길이가 몸에 맞지 않는다 (월촉·몰촉·앞어깨 볼록)", "cat": "만작 · 발시", "keywords": ["월촉", "몰촉", "너무 당", "촉이 줌을 지", "촉이 들어", "촉이 안으로", "오버드로", "화살 길이", "살 길이", "화살이 길"], "summary": "살 길이는 팔 길이에 맞춘다. 짧으면 촉이 줌통 안으로 들어오고(월촉) 근골이 덜 펴지며, 길면 앞어깨가 볼록해지고 손목을 꺾어야 만작이 된다.", "principle": ["촉이 줌통을 지나 들어오면 발시 때 화살이 줌손이나 활에 걸려 크게 빗나가거나 손을 다칠 수 있다.", "팔이 짧은데 살이 길면 앞어깨가 볼록해지고, 팔이 긴데 살이 짧으면 근육과 뼈가 완전히 펴지지 않아 꾸부정해진다(사법비전공하 전요장).", "손목을 꺾고 중구미를 아래로 젖혀야 만작이 된다면 살이 자기 몸보다 긴 것이다(조영석)."], "causes": [{"name": "화살이 짧음", "check": "촉이 줌통 안쪽으로 들어오는가?"}, {"name": "화살이 김", "check": "앞어깨가 볼록해지거나 손목을 꺾어야 만작이 되는가?"}, {"name": "만작 기준점이 없음", "check": "깍지손이 멈추는 위치가 매번 다른가?"}], "fixes": ["양팔이 알맞게 펴지는 길이의 살로 바꾼다. 무조건 긴 살이 좋은 것이 아니다.", "깍지손 멈춤 위치를 고정한다."], "drills": ["빈활로 만작 위치 고정 연습."], "classic": [{"src": "사법비전공하(1799)", "text": "살이 길어야 한다는 것은 양팔이 만족스럽고 알맞게 펴지는 것을 말하는 것이지 무조건 화살이 길어야 한다는 말은 아니다(전요장)."}, {"src": "활터 교안·용어집", "text": "활을 너무 많이 당겨 촉이 줌을 지나 쑥 들어오는 것을 월촉이라 한다."}], "related": ["over", "anchor", "arrow"], "variants": []}, {"id": "sokssa", "title": "급하게 쏜다 (속사·만작 없음)", "cat": "만작 · 발시", "keywords": ["속사", "급하게", "빨리 쏜", "조급", "만작 없이", "당기자마자", "서둘"], "summary": "만작에 이르자마자 놓으면 만작 길이와 겨냥이 매번 달라진다. '당기기→만작(펼침)→발시'의 세 박자를 지킨다.", "principle": ["급히 쏘면 몸이 아직 같은 위치에 오기 전에 발시가 일어난다. 만작 길이, 살대 위치, 줌 상태가 매번 다르니 탄착이 흩어진다.", "반대로 너무 오래 끌면 퇴촉이 생긴다. 일정한 리듬이 정답이다.", "'빨리 쏘라(방전요속)'는 당기자마자 놓으라는 뜻이 아니다. 앞손이 살을 보내는 것을 뒷손이 모르게 하라는 것, 즉 뒷손을 가볍게 하라는 뜻이다(사법비전공하)."], "causes": [{"name": "맞히려는 조급함", "check": "표에 들어오는 순간 놓아 버리는가?"}, {"name": "활이 셈", "check": "버틸 힘이 없어서 빨리 놓는가?"}], "fixes": ["만작에서 숨 한 번(2~3초)의 리듬을 정한다.", "만작 중 점검 순서를 정한다(줌 서기→살대 위치→표).", "활이 세면 바꾼다.", "조궁의 순서를 하나씩 의식하며 점검하고 다시 확인하면 속사는 저절로 없어진다. 이때 퇴촉하지 않도록 주의한다."], "drills": ["빈활로 '하나-둘-셋' 세고 놓기 연습.", "주살질에서 만작 시간 일정하게."], "classic": [{"src": "사법비전공하(1799)", "text": "빠르다는 것은 활을 당겨 조금도 지체하지 말고 곧장 내라는 것이 아니다. 앞손이 화살을 보내는 것을 뒷손이 알지 못하듯 빨리 하라는 것이다(방전요속)."}, {"src": "국궁신문 「사벽과 교정」", "text": "속사는 자기 힘으로 자유자재할 수 있는 연한 활을 갖고, 조궁 순서를 하나하나 의식적으로 점검하면 자연히 없어진다."}], "related": ["toechok", "release", "scatter", "mind"], "variants": []}, {"id": "release", "title": "발시가 안 된다 / 놓지 못한다 (겨냥 집착)", "cat": "만작 · 발시", "keywords": ["놓지 못", "발시가 안", "발시 안", "못 놓", "겨냥 집착", "표적공포", "표적 공포", "타겟패닉", "손이 안 떨어", "얼어", "놓지", "놓질", "안 놓", "놓기가"], "summary": "표가 맞을 때까지 기다리다 놓지 못하는 것은 겨냥에 마음이 묶인 것이다. 발시는 '놓는 결정'이 아니라 '펼침의 결과'가 되어야 한다.", "principle": ["발시를 손가락으로 결정하면 표에 마음이 묶여 결정을 미루게 된다. 그 사이 힘이 빠지고 퇴촉이 생긴다.", "옛 사법은 만작에서 뒷손을 조금씩 당기다 깍지가 저절로 벗겨지기를 기다리라고 한다(출전요경). 살을 낼 때 조금이라도 보내겠다는 생각을 하면 오히려 깍지손이 늦게 떨어진다(방전요속)."], "causes": [{"name": "적중 욕심", "check": "한 발 한 발 결과에 마음이 크게 흔들리는가?"}, {"name": "표를 너무 정밀하게 맞추려 함", "check": "표가 조금만 흔들려도 기다리는가?"}], "fixes": ["근거리 표적이나 빈 과녁(맞힐 곳 없는 곳)에 쏘며 펼침과 발시만 연습한다.", "표는 '대략 이 근처'로 받아들이고, 펼침이 절정이면 나간다.", "점수 대신 궁체만 평가하는 순을 따로 둔다."], "drills": ["주살질·고침쏘기로 겨냥 없이 펼침 반복.", "눈 감고 빈활 펼침 감각 익히기(안전한 장소에서 빈활로만)."], "classic": [{"src": "사법비전공하(1799)", "text": "만작한 상태에서 뒷손을 조금씩 당기면서 깍지가 저절로 벗겨지기를 기다려 살이 날아가게 한다(출전요경)."}, {"src": "사예결해(1777)", "text": "적중하고 적중하지 않는 것은 시위를 놓는 것에 달려 있다(중불중재결)."}], "related": ["sokssa", "toechok", "mind", "release_how"], "variants": []}, {"id": "tremble", "title": "만작에서 떨린다 / 버티기 힘들다", "cat": "만작 · 발시", "keywords": ["떨린다", "떨림", "부들", "버티기 힘", "버티지 못", "힘들다", "힘이 부족", "팔이 떨", "떨려", "떨리", "덜덜"], "summary": "만작 떨림의 대부분은 '활이 세다'이거나 '작은 근육으로 버틴다'이다. 등과 큰 근육으로 버티게 바꾸고, 활은 내 힘보다 한 단계 여유 있게.", "principle": ["어깨 윗근육·손목·손가락 같은 작은 근육은 빨리 지쳐 떤다. 견갑골 주변과 등의 큰 근육이 버티면 오래 안정된다.", "조선의 궁술 이래 '활은 무른 것(연궁)을 쓰라'는 가르침이 반복되는 이유가 여기에 있다."], "causes": [{"name": "활이 셈", "check": "빈활 만작 5초를 편하게 버티는가?"}, {"name": "어깨가 솟음", "check": "죽머리 항목 참조."}, {"name": "손목으로 당김", "check": "채쭉뒤 항목 참조."}, {"name": "호흡을 참음", "check": "만작에서 숨을 가슴에 가두는가?"}], "fixes": ["활을 한 단계 무르게.", "죽머리를 내리고 팔꿈치로 끈다.", "숨은 아랫배로 내리고(흉허복실) 가슴은 비운다."], "drills": ["빈활 만작 5초 × 10회를 편하게 할 수 있는 활이 내 활이다."], "classic": [{"src": "사법비전공하(1799)", "text": "활은 자기 힘에 맞게 연해야 한다. 무조건 연한 활이 아니라, 사람의 힘이 활보다 강해야 활을 부릴 수 있다(궁요연)."}], "related": ["bowweight", "jukmeori", "chaejjuk", "breath"], "variants": []}, {"id": "stance", "title": "발디딤·하체가 흔들린다 (비정비팔)", "cat": "몸 · 발", "keywords": ["발디딤", "발 모양", "발모양", "비정비팔", "하체", "발뒤꿈치", "뒤꿈치", "다리", "서는 법", "스탠스", "발 위치", "앞발", "뒷발", "장심", "체중", "무게", "발끝", "편임전족"], "summary": "발은 丁자도 八자도 아닌 비정비팔로 어깨너비만큼 벌려 선다. 두 발끝은 과녁의 양쪽 아래끝을 향하고, 발끝이 숙지 않게 하며, 땅을 크게 밟는다.", "principle": ["우리 활은 과녁을 이마로 마주하고 쏘는 활이다. 비정비팔은 두 팔이 활을 힘껏 밀고 당길 때 몸통이 어느 쪽으로도 기울거나 흔들리지 않게 하는 발 모양이다.", "앞발(줌손 쪽 발)은 방향을 잡고 뒷발(깍지손 쪽 발)은 몸이 옆으로 흔들리는 것을 막는다. '비정'은 두 발이 ㄴ자(직각)로 놓이지 않게 하라는 뜻으로도 풀이한다.", "앞다리가 과녁 쪽으로 너무 나가면 앞허벅지 힘이 빠지고, 뒷다리가 과녁 반대쪽으로 너무 빠지면 허리 힘이 빠진다(사법비전공하 각립요방).", "발 간격이 넓으면 안정되지만 움직임이 둔하고, 좁으면 그 반대다. 그래서 자기 어깨너비를 기준으로 한다.", "뒷발 위치는 상체의 회전 각도를 정한다. 뒷발을 과녁 반대쪽으로 빼면 상체가 앞쪽(줌손 손바닥 쪽)으로 돌아 살이 앞나고, 과녁 쪽으로 당기면 뒤난다."], "causes": [{"name": "발 위치가 매번 다름", "check": "사대에 표시를 해 두었는가?"}, {"name": "발끝이 숙거나 뒤꿈치가 들썩임", "check": "발바닥 전체가 땅을 잡고 있는가?"}, {"name": "체격에 맞지 않는 앞뒤 간격", "check": "키가 작은데 뒷발을 과녁 쪽으로 너무 내면 상체가 구부정해지고, 키가 큰데 과녁 반대쪽으로 너무 빼면 깍지가 덜 당겨진다."}, {"name": "무게중심이 뒤로", "check": "엉덩이가 뒤로 빠지거나 몸이 뒤로 눕지 않는가?"}], "fixes": ["기본 치수(황학정): 앞발은 과녁의 뒤쪽 끝(줌손 손등 쪽 끝)을 향해 바로 딛고, 뒷발은 발 길이의 1/2~2/3만큼 과녁 반대쪽으로 끌어 어깨너비로 벌리며, 뒷발 끝은 약 15° 바깥을 향한다.", "체중은 두 발에 고루, 발 장심에 싣는다. 당기기 전 엄지발가락으로 땅을 지그시 눌러 발바닥 전체가 땅을 잡게 한다.", "허벅지에 힘을 주고 항문을 조여 하단전에 중심을 둔다.", "한 번 맞춘 발 위치는 표시해 두고 고정한다."], "drills": ["비정비팔 자가 점검: 이마를 표에 바로 하고 비정비팔로 선 뒤, 활을 들어 줌손으로 표를 겨냥하고 만작한 상태로 어깨를 돌려 본다. 표와 이마가 바로 선 자세가 흐트러지지 않으면 맞게 선 것이다." . 국궁의 호흡 원칙."}, {"t": "달대", "d": "주살내기의 다른 이름. 장대에 줄로 매단 화살로 하는 연습."}, {"t": "불두덩·방광부", "d": "아랫배 아래쪽. 불거름과 같은 곳을 가리킨다."}, {"t": "들잡다", "d": "줌통을 활 중앙선 안쪽으로 너무 깊이 넘겨 잡는 것."}, {"t": "양지·음지", "d": "활을 세움(양지)과 약간 눕힘(음지)."}, {"t": "쪼다·쪼우다", "d": "조이다. '죽머리와 중구미로 쪼아서 쏜다.'"}, {"t": "짜다", "d": "빨래 짜듯 양손이 서로 반대로 비트는 힘을 쓰는 것. 손목을 꺾는 것과는 다르다."}, {"t": "작대", "d": "자기 만작 길이. '제 작대로 당긴다.'"}, {"t": "조궁", "d": "활을 다루어 당기고 쏘는 일."}, {"t": "이시(離矢)", "d": "살이 시위를 떠나는 것. 발시."}, {"t": "먹관", "d": "줌손이 과녁을 가려 겨냥하기 어려운 상태."}, {"t": "솟발", "d": "삼발이. 만작 때 시위·살·깍지손 세 점을 몸에 붙여 삼각으로 고정하는 것."}, {"t": "대티", "d": "턱끝."}, {"t": "도고지", "d": "활 양쪽의 시위가 닿는 부분. 아래짝 도고지를 보면 턱 각도가 활과 같아진다."}, {"t": "고자닙·정탈목", "d": "고자 부위의 이름. 고자를 굽힐 때는 정탈목을 굽힌다."}, {"t": "옥다", "d": "안쪽으로 굽다."}, {"t": "웃아귀", "d": "범아귀의 가장 깊은 곳. 우리 활은 이곳으로 짚어 밀지 않는다."}, {"t": "노궁(老弓)", "d": "늙은 활량의 궁체. 깍지손이 내려가는 것을 그 지름길로 경계했다."}, {"t": "죽은죽·솟은어깨", "d": "앞어깨가 불룩 튀어나온 것. 시위가 팔을 때리는 원인."}, {"t": "숫깍지", "d": "혀가 달린 깍지. 엄지가 짧을 때 혀 길이로 보완한다."}, {"t": "외가락", "d": "엄지를 검지로만 걸어 쥐는 것. 뒤가 부실해진다."}, {"t": "심(審)", "d": "만작 뒤에 자세 전체를 살펴 굳히는 것."}, {"t": "전수별 후수절", "d": "앞손은 뿌리고 뒷손은 끊듯 발시하는 것(사예결해). 별절."}, {"t": "흉허복실 좌액활여", "d": "가슴은 비우고 배는 채우며 줌팔 쪽 겨드랑이는 넓힌다(사예결해)."}, {"t": "피아(彼我)", "d": "정사론의 개념. 얼굴·몸통은 나(我), 팔·마디는 저(彼). 팔이 몸을 따라야 바르다."}, {"t": "원실(原失)", "d": "사법비전공하에서 맞지 않는 근본 원인 열 가지(불가필중 십원실)."}, {"t": "심담십사요", "d": "사법비전공하의 활쏘기 14요결. 궁요연·전요장·흉전의흡 등."}, {"t": "반구저기신", "d": "정곡을 맞히지 못하면 원인을 자신에게서 찾는다(중용)."}, {"t": "깃", "d": "화살 끝(오늬 쪽)에 붙인 새깃. 발시 때 줌손 위를 마지막으로 지나간다."}, {"t": "출전피", "d": "활 옆에 살이 닿는 곳에 붙인 가죽."}, {"t": "표(標)", "d": "겨냥할 때 줌통·줌손이 과녁에 걸리는 기준점."}, {"t": "주시안", "d": "두 눈 중 주로 쓰는 눈. 겨냥하는 눈이 주시안이어야 표가 흔들리지 않는다."}, {"t": "오조준", "d": "과녁 중심선에서 비켜난 곳을 표로 삼아 쏘는 것."}]}</script>
<script>
const KB = JSON.parse(document.getElementById('kb').textContent);
const byId = Object.fromEntries(KB.items.map(i => [i.id, i]));
let current = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/[\s.,!?~·()\/"'“”‘’:;\-_]/g, '');

// 간단한 형태 정리: 흔한 어미를 떼어 어간 비교를 돕는다
const ENDINGS = ['습니다','합니다','해요','어요','아요','네요','는데요','는데','을때','ㄹ때','할때','때','요','다','고','면'];
function stem(q){
  let s = q;
  for (let k=0;k<2;k++){ for (const e of ENDINGS){ if (s.length > e.length+1 && s.endsWith(e)){ s = s.slice(0, -e.length); break; } } }
  return s;
}
function bigrams(s){ const out=new Set(); for(let i=0;i<s.length-1;i++) out.add(s.slice(i,i+2)); return out; }

function score(item, qn, qs){
  let sc = 0;
  const kws = [item.title, ...item.keywords];
  for (const kw of kws){
    const k = norm(kw);
    if (!k) continue;
    if (qn.includes(k)) sc += 10 + k.length;
    else if (qs.length >= 2 && k.includes(qs)) sc += 6 + qs.length;
  }
  if (sc === 0 && qn.length >= 2){
    const hay = norm(kws.join(' ') + item.summary);
    const qb = bigrams(qs.length>=2?qs:qn); let hit=0;
    for (const b of qb) if (hay.includes(b)) hit++;
    if (qb.size) sc += (hit / qb.size) * 6;
  }
  return sc;
}
function directional(qn){
  const bonus = {};
  if (/오른쪽|우측|오른편|왼쪽|좌측|왼편/.test(qn)) { bonus.ap = 20; bonus.dwi = 20; }
  if (/손바닥쪽|손바닥방향/.test(qn)) bonus.ap = 25;
  if (/손등쪽|손등방향/.test(qn)) bonus.dwi = 25;
  return bonus;
}
const LR_NOTE = '왼쪽·오른쪽은 궁사마다 다릅니다. 줌손 손바닥 쪽으로 빠지면 앞난다, 손등 쪽으로 빠지면 뒤난다를 보세요.';
function search(q){
  const qn = norm(q); if (!qn) return {items:[], gloss:[]};
  const qs = stem(qn);
  const bonus = directional(qn);
  const ranked = KB.items.map(it => ({it, s: score(it, qn, qs) + (bonus[it.id]||0)}))
    .filter(x => x.s >= 3).sort((a,b) => b.s - a.s);
  const gloss = KB.glossary.filter(g => { const t = norm(g.t.split('·')[0]); return t.length>=2 && (qn.includes(t) || (qs.length>=2 && t===qs)); });
  const gl = gloss.filter(g => !gloss.some(o => o!==g && o.t.length > g.t.length && o.t.includes(g.t.split('·')[0])));
  const lr = /오른쪽|우측|오른편|왼쪽|좌측|왼편/.test(qn);
  return {items: ranked.map(x=>x.it), gloss: gl.slice(0,3), lr};
}

function dirLine(it){
  if (!it.dir) return '';
  return `<div class="dir"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2.5" fill="currentColor"/></svg>${esc(it.dir)}</div>`;
}
let lrFlag = false;
function render(it, gloss){
  current = it;
  const el = $('#detail');
  if (!it){ el.innerHTML = `<div class="card"><div class="empty">${gloss&&gloss.length?glossHtml(gloss):''}맞는 항목을 찾지 못했습니다. 다른 말로 적어 보거나 과녁 그림에서 탄착 위치를 눌러 보세요.</div></div>`; return; }
  const handNote = lrFlag ? `<p class="note">${LR_NOTE}</p>` : '';
  el.innerHTML = `
  ${gloss&&gloss.length?glossHtml(gloss):''}
  <article class="card">
    <div class="card-head">
      <span class="cat">${esc(it.cat)}</span>
      <h3>${esc(it.title)}</h3>
      ${dirLine(it)}
      <p class="summary">${esc(it.summary)}</p>
      ${handNote}
    </div>
    <div class="sec"><h4>왜 그런가 · 원리</h4>${it.principle.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    ${it.causes.length?`<div class="sec"><h4>원인 점검 · 해당하는 것에 표시</h4><ul class="checks">${it.causes.map((c,i)=>`<li><label><input type="checkbox" id="c-${it.id}-${i}"><span><b>${esc(c.name)}</b><span class="q">${esc(c.check)}</span></span></label></li>`).join('')}</ul></div>`:''}
    <div class="sec"><h4>${it.id==='basics'?'사법 8단계':'교정법'}</h4><ol class="fix">${it.fixes.map(f=>`<li>${esc(f)}</li>`).join('')}</ol></div>
    ${it.drills.length?`<div class="sec"><h4>연습 방법</h4><ul class="drill">${it.drills.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`:''}
    ${it.classic.length?`<div class="sec"><h4>옛 가르침 · 근거</h4><div class="classic">${it.classic.map(c=>`<blockquote>${esc(c.text)}<cite>${esc(c.src)}</cite></blockquote>`).join('')}</div></div>`:''}
    ${(it.variants||[]).length?`<div class="sec"><h4>자료마다 다른 설명</h4><div class="classic">${it.variants.map(c=>`<blockquote class="var">${esc(c.text)}<cite>${esc(c.src)}</cite></blockquote>`).join('')}</div></div>`:''}
    ${it.related.length?`<div class="sec"><h4>함께 볼 항목</h4><div class="rel">${it.related.map(r=>byId[r]?`<button class="chip" data-go="${r}">${esc(byId[r].title)}</button>`:'').join('')}</div></div>`:''}
  </article>`;
  document.querySelectorAll('#results button').forEach(b => b.setAttribute('aria-current', b.dataset.go===it.id ? 'true':'false'));
  try { history.replaceState(null, '', '#' + it.id); } catch(e){}
}
function glossHtml(g){ return g.map(x=>`<div class="gloss-hit"><b>${esc(x.t)}</b> — ${esc(x.d)}</div>`).join(''); }
function list(items, title){
  $('#res-title').textContent = title;
  $('#results').innerHTML = items.length ? items.slice(0,8).map(it=>`<li><button data-go="${it.id}"><span class="rt">${esc(it.title)}</span><span class="rc">${esc(it.cat)}</span></button></li>`).join('') : '<li class="hint">결과 없음</li>';
}
function run(q){
  const {items, gloss, lr} = search(q);
  lrFlag = lr;
  list(items, items.length ? `“${q}” 관련 항목` : '관련 항목');
  render(items[0] || null, gloss);
}
function go(id){ const it = byId[id]; if (!it) return; lrFlag = false; render(it); if (![...document.querySelectorAll('#results button')].some(b=>b.dataset.go===id)) list([it, ...it.related.map(r=>byId[r]).filter(Boolean)], `${it.title} 와(과) 관련`); render(it); showTab('diag'); }

document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b){ go(b.dataset.go); if (window.innerWidth < 860) $('#detail').scrollIntoView({behavior:'smooth', block:'start'}); } });
$('#sform').addEventListener('submit', e => { e.preventDefault(); run($('#q').value); });

const EX = ['화살이 앞날 때','뒤나요','살이 덜 간다','시위가 팔을 때려요','발시는 어떻게','활 기울기','줌손이 과녁을 가려요','바람','표 보는 법','처음 배우는 순서','깍지 쥐는 법','깃이 줌손을 쳐요','시위가 볼을 쳐요'];
$('#examples').innerHTML = EX.map(x=>`<button class="chip" type="button" data-ex="${esc(x)}">${esc(x)}</button>`).join('');
$('#examples').addEventListener('click', e => { const b=e.target.closest('[data-ex]'); if(b){ $('#q').value=b.dataset.ex; run(b.dataset.ex);} });

// 과녁
function zoneAct(id){
  const map = {'z-top':'over','z-bot':'short','z-mid':'scatter','z-left':'dwi','z-right':'ap'};
  lrFlag = false;
  const t = map[id]; const it = byId[t];
  list([it, ...it.related.map(r=>byId[r]).filter(Boolean)], `${it.title} 와(과) 관련`);
  render(it);
}
document.querySelectorAll('.zone').forEach(z => {
  z.addEventListener('click', () => zoneAct(z.id));
  z.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); zoneAct(z.id);} });
});

// 탭
function showTab(t){
  for (const n of ['diag','all','gloss','src']){ $('#tab-'+n).setAttribute('aria-selected', n===t); $('#view-'+n).hidden = n!==t; }
}
$('#tab-diag').onclick=()=>showTab('diag'); $('#tab-all').onclick=()=>showTab('all'); $('#tab-gloss').onclick=()=>showTab('gloss'); $('#tab-src').onclick=()=>showTab('src');

// 전체 항목
const cats = [...new Set(KB.items.map(i=>i.cat))];
$('#all').innerHTML = cats.map(c=>`<div><h3>${esc(c)}</h3><div class="all-list">${KB.items.filter(i=>i.cat===c).map(i=>`<button data-go="${i.id}"><b>${esc(i.title)}</b><span class="s">${esc(i.summary)}</span></button>`).join('')}</div></div>`).join('');

// 용어
function drawGloss(f){
  const fn = norm(f||'');
  $('#gloss').innerHTML = KB.glossary.filter(g => !fn || norm(g.t+g.d).includes(fn)).map(g=>`<div class="gl"><dt>${esc(g.t)}</dt><dd>${esc(g.d)}</dd></div>`).join('') || '<p class="hint">찾는 용어가 없습니다.</p>';
}
drawGloss(''); $('#gq').addEventListener('input', e => drawGloss(e.target.value));

$('#srcs').innerHTML = KB.meta.sources.map(s=>`<li><b>${esc(s.key)}</b><span>${esc(s.desc)}</span></li>`).join('');
$('#motto').textContent = KB.meta.motto || '';
$('#meta').textContent = `${KB.meta.version} · 항목 ${KB.items.length}개 · 용어 ${KB.glossary.length}개 · ${KB.meta.basis}`;
$('#copy-json').onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(KB, null, 2)); $('#copy-msg').textContent = '복사했습니다.'; }
  catch(e){ $('#copy-msg').textContent = '이 화면에서는 복사가 막혀 있습니다.'; }
};

// 시작 화면: 주소의 #항목 또는 '화살이 앞날 때' 예시
const start = location.hash.slice(1);
if (byId[start]) go(start); else { $('#q').value = '화살이 앞날 때'; run('화살이 앞날 때'); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (byId[h] && (!current || current.id!==h)) go(h); });
</script>
</body>
</html>
